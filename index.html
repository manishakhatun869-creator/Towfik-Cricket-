<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12382f" />
    <meta name="description" content="Towfik Cricket Score — a premium home for live cricket scores, fixtures, competitions and player insights." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
    <title>Towfik Cricket Score — Every ball, in focus</title>
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sidebar-top">
          <a class="brand-link" href="#overview" data-page="overview" aria-label="Towfik Cricket Score home">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none">
                <path d="M13 32.5h22" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" />
                <path d="M17 31V17m7 14V13m7 18V17" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" />
                <path d="M12 37.2h24" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" />
                <circle cx="35.2" cy="13.2" r="5.2" fill="#f2a36f" />
                <path d="M32.3 11.3c1.7.3 3.4 1.3 4.7 2.9" stroke="#fff4e7" stroke-width="1.2" stroke-linecap="round" />
              </svg>
            </span>
            <span class="brand-lockup">
              <strong>TOWFIK</strong>
              <span>CRICKET <em>SCORE</em></span>
            </span>
          </a>
          <button class="sidebar-close icon-button" id="sidebarClose" aria-label="Close navigation" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </div>

        <div class="sidebar-scroll">
          <div class="sidebar-group">
            <p class="nav-label">YOUR SPACE</p>
            <nav class="primary-nav" aria-label="Workspace">
              <button class="nav-item is-active" type="button" data-page="overview" aria-label="Overview">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.7"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.7"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.7"/></svg>
                <span>Overview</span>
              </button>
              <button class="nav-item" type="button" data-page="live" aria-label="Live scores">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.7l3 1.8"/><path d="M4.8 5.2 3.3 6.7m16.2-1.5 1.2 1.5"/></svg>
                <span>Live scores</span>
                <span class="nav-count">02</span>
              </button>
              <button class="nav-item" type="button" data-page="fixtures" aria-label="Fixtures">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17M8 13h2m4 0h2m-8 3.5h2"/></svg>
                <span>Fixtures</span>
              </button>
              <button class="nav-item" type="button" data-page="competitions" aria-label="Competitions">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4.5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4.5v2a4 4 0 0 0 4 4M16 6h3.5v2a4 4 0 0 1-4 4M12 12.5V17m-4 3h8m-7-3h6v3H9z"/></svg>
                <span>Competitions</span>
              </button>
            </nav>
          </div>

          <div class="sidebar-group sidebar-group--secondary">
            <p class="nav-label">DISCOVER</p>
            <nav class="primary-nav" aria-label="Discover">
              <button class="nav-item" type="button" data-page="rankings" aria-label="Rankings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5h16M6.5 16V11m5 5V5m5 11V8m-10-5h.1m5-1h.1m5 6h.1"/><path d="m5 7 5-3 5 2 4-2"/></svg>
                <span>Rankings</span>
              </button>
              <button class="nav-item" type="button" data-page="insights" aria-label="Player insights">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7L12 3Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9L19 15ZM5 2l.7 1.6L7.5 4.3l-1.8.7L5 7l-.7-2L2.5 4.3l1.8-.7L5 2Z"/></svg>
                <span>Player insights</span>
              </button>
            </nav>
          </div>

          <div class="sidebar-promo">
            <div class="promo-topline"><span class="promo-star">✦</span><span>THE CLUB</span><span class="promo-pill">PREMIUM</span></div>
            <strong>Closer to every ball.</strong>
            <p>Make matchday feel like yours.</p>
            <button type="button" class="promo-link" data-action="premium">Explore the club <span aria-hidden="true">↗</span></button>
            <span class="promo-orbit promo-orbit--one" aria-hidden="true"></span>
            <span class="promo-orbit promo-orbit--two" aria-hidden="true"></span>
          </div>
        </div>

        <div class="sidebar-user">
          <div class="user-avatar user-avatar--sidebar">T</div>
          <div class="sidebar-user-copy"><strong>Towfik</strong><span>Cricket fan</span></div>
          <button class="user-more" type="button" data-action="profile" aria-label="Open profile menu"><span></span><span></span><span></span></button>
        </div>
      </aside>

      <button class="sidebar-scrim" id="sidebarScrim" aria-label="Close navigation" type="button" tabindex="-1"></button>

      <div class="main-shell">
        <header class="topbar">
          <button class="mobile-menu-button icon-button" id="mobileMenu" type="button" aria-label="Open navigation">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          </button>
          <div class="topbar-context"><span class="context-mark">T</span><span>TOWFIK</span><i>/</i><span class="context-current">SCOREBOARD</span></div>

          <div class="search-wrap" id="searchWrap">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
            <input id="globalSearch" type="search" autocomplete="off" placeholder="Search teams, matches, players" aria-label="Search teams, matches and players" />
            <kbd class="search-shortcut">/</kbd>
            <div class="search-popover" id="searchPopover" hidden></div>
          </div>

          <div class="topbar-actions">
            <span class="preview-pill"><span></span> PREVIEW</span>
            <button class="icon-button notification-button" type="button" data-action="notifications" aria-label="Notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-2.5 7.5-2.5 9h17C20.5 16.5 18 16 18 9ZM10 21h4" /></svg>
              <span class="notification-dot"></span>
            </button>
            <span class="topbar-divider" aria-hidden="true"></span>
            <button class="profile-button" type="button" data-action="profile" aria-label="Towfik profile">
              <span class="user-avatar user-avatar--top">T</span>
              <span class="profile-copy"><strong>Towfik</strong><small>My account</small></span>
              <svg class="profile-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
            </button>
          </div>
        </header>

        <main class="page-container" id="appView" tabindex="-1" aria-live="polite">
          <div class="loading-fallback"><span class="loading-dot"></span>Setting up your scoreboard…</div>
        </main>
      </div>

      <nav class="mobile-nav" aria-label="Quick navigation">
        <button class="mobile-nav-item is-active" type="button" data-page="overview" aria-label="Overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7" height="7" rx="1.7"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.7"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.7"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.7"/></svg>
          <span>Home</span>
        </button>
        <button class="mobile-nav-item" type="button" data-page="live" aria-label="Live scores">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.7l3 1.8"/></svg>
          <span>Live</span>
        </button>
        <button class="mobile-nav-item" type="button" data-page="fixtures" aria-label="Fixtures">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M7.5 3.5v3M16.5 3.5v3M3.5 9.5h17"/></svg>
          <span>Fixtures</span>
        </button>
        <button class="mobile-nav-item" type="button" data-page="competitions" aria-label="Competitions">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4h8v4.5a4 4 0 0 1-8 0V4Z"/><path d="M8 6H4.5v2a4 4 0 0 0 4 4M16 6h3.5v2a4 4 0 0 1-4 4M12 12.5V17m-4 3h8m-7-3h6v3H9z"/></svg>
          <span>Series</span>
        </button>
        <button class="mobile-nav-item" type="button" data-action="mobile-menu" aria-label="More sections">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>
          <span>More</span>
        </button>
      </nav>

      <div class="modal-root" id="modalRoot"></div>
      <div class="toast-region" id="toastRegion" role="status" aria-live="polite"></div>
    </div>
    <script src="app.js" defer></script>
  </body>
</html>
